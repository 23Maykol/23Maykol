<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Maykol Litari, Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#F778BA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
    <path id="petal" d="M0 0 C3 -7 11 -6 10 1 C9 7 2 8 0 0 Z"/>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; white-space: pre; }
    .sans { font-family: 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
    .jp   { font-family: 'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif; }
    .r    { opacity: 0; animation: rise .9s ease-out forwards; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { fill-opacity: 1; } 50%, 100% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .r { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" opacity="0.55"/>

    <!-- resplandores suaves -->
    <circle cx="980" cy="40" r="150" fill="#1F6FEB" opacity="0.28" filter="url(#blur)">
      <animate attributeName="opacity" values="0.20;0.34;0.20" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="960;1010;960" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="340" r="130" fill="#F778BA" opacity="0.13" filter="url(#blur)">
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- petalos de sakura, muy sutiles -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="640,-20; 690,90; 650,200; 720,345" dur="13s" begin="-1s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/><use href="#petal" fill="#F778BA" opacity="0.45"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="820,-20; 780,110; 850,220; 800,345" dur="16s" begin="-7s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite"/><use href="#petal" fill="#F9A8D4" opacity="0.4"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="960,-20; 1010,100; 950,210; 1020,345" dur="14s" begin="-4s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/><use href="#petal" fill="#F778BA" opacity="0.5"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1100,-20; 1060,120; 1120,230; 1070,345" dur="18s" begin="-11s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/><use href="#petal" fill="#F9A8D4" opacity="0.4"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="420,-20; 470,100; 410,210; 480,345" dur="19s" begin="-9s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="11s" repeatCount="indefinite"/><use href="#petal" fill="#F778BA" opacity="0.28"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="890,-20; 930,100; 880,215; 940,345" dur="15s" begin="-12s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/><use href="#petal" fill="#F9A8D4" opacity="0.35"/></g>
    </g>

    <!-- bloque de codigo tenue a la derecha -->
    <g opacity="0.5">
      <text x="720" y="104" class="mono r" xml:space="preserve" font-size="15" fill="#8B949E" style="animation-delay:2.2s"><tspan fill="#FF7B72">public class</tspan> <tspan fill="#D2A8FF">Maykol</tspan> : <tspan fill="#D2A8FF">Developer</tspan></text>
      <text x="720" y="132" class="mono r" xml:space="preserve" font-size="15" fill="#8B949E" style="animation-delay:2.5s">{</text>
      <text x="720" y="160" class="mono r" xml:space="preserve" font-size="15" fill="#8B949E" style="animation-delay:2.8s">  <tspan fill="#79C0FF">Stack</tspan> = [<tspan fill="#A5D6FF">".NET"</tspan>, <tspan fill="#A5D6FF">"Next.js"</tspan>, <tspan fill="#A5D6FF">"Flutter"</tspan>];</text>
      <text x="720" y="188" class="mono r" xml:space="preserve" font-size="15" fill="#8B949E" style="animation-delay:3.1s">  <tspan fill="#79C0FF">Learning</tspan> = <tspan fill="#FF7B72">true</tspan>;</text>
      <text x="720" y="216" class="mono r" xml:space="preserve" font-size="15" fill="#8B949E" style="animation-delay:3.4s">}</text>
    </g>

    <!-- texto japones vertical -->
    <text x="1160" y="52" class="jp r" font-size="17" fill="#F778BA" fill-opacity="0.6" letter-spacing="7" style="writing-mode:vertical-rl; animation-delay:3.6s">ソフトウェア開発者</text>

    <!-- contenido principal -->
    <text x="64" y="94" class="mono r" xml:space="preserve" font-size="20" fill="#8B949E" style="animation-delay:.2s"><tspan fill="#58A6FF">$</tspan> whoami</text>

    <text x="62" y="176" class="sans r" font-size="74" font-weight="700" letter-spacing="-1.5" fill="url(#name)" style="animation-delay:.8s">Maykol Litari</text>

    <text x="64" y="224" class="sans r" font-size="26" fill="#E6EDF3" style="animation-delay:1.4s">Software Developer <tspan fill="#58A6FF">/ Web &amp; Mobile</tspan></text>

    <text x="64" y="268" class="mono r" xml:space="preserve" font-size="18" fill="#6E7681" style="animation-delay:2s">// .NET · Next.js · Flutter · Python<tspan class="cursor" fill="#58A6FF"> _</tspan></text>

    <!-- linea de luz inferior -->
    <rect x="-400" y="315" width="400" height="5" fill="url(#sweep)">
      <animate attributeName="x" values="-400;1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#30363D"/>
</svg>
